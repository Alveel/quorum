stages:
  - verify
  - release

variables:
  # -- image tags --
  # renovate: datasource=docker depName=registry.access.redhat.com/hi/go
  GO_BUILDER_TAG: "1.26-builder"
  # renovate: datasource=docker depName=registry.access.redhat.com/ubi10/ubi-micro
  UBI_TAG: "10.2-1787684489"
  # renovate: datasource=docker depName=golangci/golangci-lint
  GOLANGCI_TAG: "v2.13.2"
  # renovate: datasource=docker depName=alpine/helm
  HELM_TAG: "4.2.4"
  # renovate: datasource=docker depName=quay.io/containers/buildah
  BUILDAH_TAG: "9.8"
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_TAG: "44.65-full"
  # -- images (pulled from read/proxy endpoint) --
  GO_IMAGE: "${REGISTRY_PROXY_URL}/hi/go:${GO_BUILDER_TAG}"
  UBI_IMAGE: "${REGISTRY_PROXY_URL}/ubi10/ubi-micro:${UBI_TAG}"
  GOLANGCI_IMAGE: "${REGISTRY_PROXY_URL}/golangci/golangci-lint:${GOLANGCI_TAG}"
  HELM_IMAGE: "${REGISTRY_PROXY_URL}/alpine/helm:${HELM_TAG}"
  BUILDAH_IMAGE: "${REGISTRY_PROXY_URL}/ubi9/buildah:${BUILDAH_TAG}"
  RENOVATE_IMAGE: "${REGISTRY_PROXY_URL}/renovate/renovate:${RENOVATE_TAG}"
  # -- app image (pushed to write endpoint) --
  APP_IMAGE: "${REGISTRY_WRITE_URL}/quorum"
  # -- Go --
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOPROXY: "https://${GO_REGISTRY_URL}/repository/golang-proxy,direct"
  GOSUMDB: "sum.golang.org https://${GO_REGISTRY_URL}/repository/raw-golang-sum-proxy/"
  # -- npm --
  NPM_REPOSITORY: "npm-proxy"
  # -- buildah --
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker

# ── pipeline scope ──────────────────────────────────────────────────────────
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── defaults ────────────────────────────────────────────────────────────────
default:
  tags:
    - default

# ── shared rules ────────────────────────────────────────────────────────────
# the triggers of `test` and `lint` must be a superset of
# `build-image`'s. `needs:` is resolved at pipeline creation, so if `lint` can
# be excluded while `build-image` is included, the whole pipeline fails to
# create ("`lint` does not exist in the pipeline"). One shared list; do not
# fork it per job.
.app-changes: &app-changes
  - "**/*.go"
  - "**/*.templ"
  - go.mod
  - go.sum
  - "migrations/**"
  - "web/**"
  - "internal/locale/locales/**" # embedded via //go:embed, not matched by *.go
  - Containerfile
  - Makefile
  - .gitlab-ci.yml

.app-rules: &app-rules
  # `CI_COMMIT_BRANCH` is set in scheduled pipelines too, so this guard has to
  # come first.
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_TAG # always verify a tag
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # always verify main
  - changes: *app-changes

# ── verify ──────────────────────────────────────────────────────────────────

commit-lint:
  stage: verify
  image: "$GO_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      echo "$CI_MERGE_REQUEST_TITLE" \
        | grep -qE '^(feat|fix|chore|docs|style|refactor|test|build|ci|perf|revert)(\([^)]+\))?!?: .+' \
        || { echo "MR title must follow Conventional Commits: https://www.conventionalcommits.org"; exit 1; }

test:
  stage: verify
  image: "$GO_IMAGE"
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go/pkg/mod]
  rules: *app-rules
  script:
    - go tool templ generate && git diff --exit-code
    - go test ./...
    - CGO_ENABLED=0 go build -o bin/server ./cmd/server

lint:
  stage: verify
  image: "$GOLANGCI_IMAGE"
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go/pkg/mod]
  rules: *app-rules
  script:
    - golangci-lint run

# Deliberately unconditional: gating this on `deploy/helm/**` would let
# `publish-chart`'s `needs:` dangle.
helm-lint:
  stage: verify
  image: "$HELM_IMAGE"
  rules:
    # Explicit: a job with no rules falls back to `only: [branches, tags]`,
    # which excludes merge request pipelines.
    - when: always
  script:
    - helm lint deploy/helm/quorum -f deploy/helm/quorum/values.lint.yaml
    - helm lint deploy/helm/quorum -f deploy/helm/quorum/values.lint.httproute-oidc.yaml

# ── release ─────────────────────────────────────────────────────────────────

build-image:
  stage: release
  tags:
    - buildah-build
  image: "$BUILDAH_IMAGE"
  needs: [test, lint, helm-lint]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *app-changes
  before_script:
    - buildah login --username "$REGISTRY_USER" --password "$REGISTRY_PASSWORD" "$REGISTRY_WRITE_URL"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG1="${APP_IMAGE}:${CI_COMMIT_TAG}"
        TAG2="${APP_IMAGE}:${CI_COMMIT_TAG#v}"
      else
        TAG1="${APP_IMAGE}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
        TAG2="${APP_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      fi
      buildah build \
        --storage-driver=$STORAGE_DRIVER \
        --layers \
        --build-arg GO_IMAGE=${GO_IMAGE} \
        --build-arg UBI_IMAGE=${UBI_IMAGE} \
        --build-arg GOPROXY="${GOPROXY}" \
        --build-arg GOSUMDB="${GOSUMDB}" \
        --tag "$TAG1" \
        --tag "$TAG2" \
        -f Containerfile .
      buildah push --storage-driver=$STORAGE_DRIVER "$TAG1"
      buildah push --storage-driver=$STORAGE_DRIVER "$TAG2"

publish-chart:
  stage: release
  image: "$HELM_IMAGE"
  needs: [helm-lint]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "deploy/helm/**"
  script:
    - |
      CHART_VERSION=$(grep '^version:' deploy/helm/quorum/Chart.yaml | awk '{print $2}')
      if curl -sf -u "${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
          "${REGISTRY_HELM_URL}/quorum-${CHART_VERSION}.tgz" > /dev/null 2>&1; then
        echo "Chart version ${CHART_VERSION} already exists. Bump version in Chart.yaml."
        exit 1
      fi
      helm package deploy/helm/quorum
      helm push quorum-${CHART_VERSION}.tgz oci://${REGISTRY_HELM_URL} \
        --username ${REGISTRY_USER} \
        --password ${REGISTRY_PASSWORD}

# ── renovate (scheduled only) ────────────────────────────────────────────────

renovate:
  stage: verify
  image: "$RENOVATE_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    RENOVATE_HOST_RULES: >-
      [{"matchHost":"${REGISTRY_PROXY_URL}","username":"${REGISTRY_USER}","password":"${REGISTRY_PASSWORD}"}]
    npm_config_registry: "https://${REGISTRY_PROXY_URL}/repository/$NPM_REPOSITORY/"
  script:
    - renovate
        --platform=gitlab
        --endpoint="${CI_SERVER_URL}/api/v4"
        --token="$RENOVATE_GITLAB_TOKEN"
        "$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME"
